<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="40%" stop-color="#EAB308" />
      <stop offset="80%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#A16207" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F284E" />
      <stop offset="100%" stop-color="#071326" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#EAB308" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Crest Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield Frame -->
    <path d="M 50 4 L 88 18 C 88 56, 76 82, 50 96 C 24 82, 12 56, 12 18 Z" 
          fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="3" filter="url(#goldGlow)" />
    <!-- Inner Gold Line -->
    <path d="M 50 12 L 80 23 C 80 54, 70 76, 50 88 C 30 76, 20 54, 20 23 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="3,2" />
    <!-- Monogram M & Receipt Graphic -->
    <path d="M 32 64 L 32 36 L 43 52 L 50 42 L 57 52 L 68 36 L 68 64" 
          fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Checkmark Accent -->
    <circle cx="50" cy="74" r="6" fill="#EAB308" />
    <path d="M 47 74 L 49.5 76.5 L 53.5 71.5" fill="none" stroke="#071326" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography -->
  <!-- MTCC -->
  <text x="124" y="60" font-family="'Space Grotesk', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="44" fill="#FFFFFF" letter-spacing="1">
    MTCC
  </text>
  <!-- BillPro -->
  <text x="254" y="60" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="44" fill="url(#goldGrad)" letter-spacing="-0.5">
    BillPro
  </text>
  <!-- Badge Pill NON-GST -->
  <g transform="translate(422, 33)">
    <rect width="90" height="24" rx="12" fill="#1E293B" stroke="#EAB308" stroke-width="1.2"/>
    <text x="45" y="16.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FDE047" text-anchor="middle" letter-spacing="0.8">NON-GST</text>
  </g>
  <!-- Tagline -->
  <text x="126" y="86" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="13" fill="#94A3B8" letter-spacing="1.5">
    SMART  •  SIMPLE  •  PROFESSIONAL BILLING
  </text>
</svg>
